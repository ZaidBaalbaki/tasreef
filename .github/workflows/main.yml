name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          channel: 'stable'
          cache: true
          
      - name: Setup project
        run: |
          flutter config --no-analytics
          flutter config --enable-web
          
      - name: Install dependencies
        run: |
          rm -rf .dart_tool/
          rm -f pubspec.lock
          flutter clean
          flutter pub get
        
      - name: Build web app
        run: |
          flutter build web \
            --release \
            --base-href /tasreef/ \
            --web-renderer html

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
