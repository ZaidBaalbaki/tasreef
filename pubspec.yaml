name: easy_exchange
description: A currency exchange rate app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <3.3.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  
  http: 0.13.6
  decimal: 2.3.3
  rxdart: 0.27.7
  provider: 6.1.1
  fl_chart: 0.65.0
  intl: 0.18.1
  cupertino_icons: 1.0.6
  equatable: 2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.1

flutter:
  uses-material-design: true

  fonts:
    - family: TitilliumWeb
      fonts:
        - asset: assets/fonts/TitilliumWeb-Regular.ttf
        - asset: assets/fonts/TitilliumWeb-Italic.ttf
          style: italic
        - asset: assets/fonts/TitilliumWeb-Bold.ttf
          weight: 800

  assets:
    - assets/images/
